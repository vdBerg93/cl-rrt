name: Docker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only authenticate on push to master; PRs from forks won't have write access
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only on merge to master; PRs just build to validate the Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/vdberg93/cl-rrt:latest
          # Cache layers between runs using the GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
