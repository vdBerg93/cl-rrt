name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and check (ROS Melodic)
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: melodic
          # vision_msgs and robot_localization are not bundled with ros-melodic-desktop
          ADDITIONAL_DEBS: >-
            ros-melodic-vision-msgs
            ros-melodic-robot-localization
            ros-melodic-visualization-msgs
          # state_estimator depends on prius_msgs (osrf/car_demo), a Gazebo
          # simulator package not available in the ROS apt index.
          # The other three packages are fully verified here.
          CATKIN_BLACKLIST_PACKAGES: state_estimator
          CMAKE_BUILD_TYPE: Release
